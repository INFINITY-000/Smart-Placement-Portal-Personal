<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Placement Cell Login | Smart Placement Portal</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
        rel="stylesheet">

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;

            font-family: "Segoe UI", sans-serif;

            background:
                radial-gradient(
                    circle at top left,
                    #312e81,
                    transparent 35%
                ),
                radial-gradient(
                    circle at bottom right,
                    #581c87,
                    transparent 35%
                ),
                #080b16;

            color: white;

            display: flex;
            align-items: center;
            justify-content: center;
        }

        .login-wrapper {
            width: 100%;
            max-width: 450px;
            padding: 20px;
        }

        .login-card {

            padding: 40px;

            border-radius: 22px;

            background:
                rgba(15,23,42,0.85);

            border:
                1px solid rgba(255,255,255,0.1);

            backdrop-filter: blur(18px);

            box-shadow:
                0 25px 80px rgba(0,0,0,0.5);
        }

        .icon-box {

            width: 75px;
            height: 75px;

            margin: 0 auto 20px;

            border-radius: 20px;

            display: flex;
            align-items: center;
            justify-content: center;

            font-size: 32px;

            background:
                linear-gradient(
                    135deg,
                    #7c3aed,
                    #4f46e5
                );

            box-shadow:
                0 12px 35px rgba(124,58,237,0.35);
        }

        .logo {

            text-align: center;

            font-size: 27px;

            font-weight: 700;

            margin-bottom: 7px;
        }

        .logo span {
            color: #8b5cf6;
        }

        .subtitle {

            text-align: center;

            color: #94a3b8;

            margin-bottom: 30px;
        }

        label {

            color: #cbd5e1;

            font-size: 14px;

            margin-bottom: 7px;
        }

        .form-control {

            background: #0f172a;

            border:
                1px solid rgba(255,255,255,0.1);

            color: white;

            padding: 13px;

            border-radius: 10px;
        }

        .form-control:focus {

            background: #0f172a;

            color: white;

            border-color: #7c3aed;

            box-shadow:
                0 0 0 3px rgba(124,58,237,0.15);
        }

        .form-control::placeholder {
            color: #64748b;
        }

        .login-btn {

            width: 100%;

            border: none;

            padding: 13px;

            border-radius: 10px;

            color: white;

            font-weight: 600;

            background:
                linear-gradient(
                    135deg,
                    #7c3aed,
                    #4f46e5
                );

            transition: 0.3s;
        }

        .login-btn:hover {

            transform: translateY(-2px);

            box-shadow:
                0 10px 30px rgba(124,58,237,0.3);
        }

        .demo-box {

            margin-top: 25px;

            padding: 16px;

            border-radius: 12px;

            background:
                rgba(124,58,237,0.08);

            border:
                1px solid rgba(124,58,237,0.2);

            color: #cbd5e1;

            font-size: 13px;
        }

        .demo-box strong {
            color: #a78bfa;
        }

        .error {

            display: none;

            margin-bottom: 15px;

            padding: 10px;

            border-radius: 8px;

            color: #f87171;

            background:
                rgba(239,68,68,0.1);

            border:
                1px solid rgba(239,68,68,0.2);

            font-size: 13px;
        }

        .back-home {

            display: block;

            text-align: center;

            margin-top: 22px;

            color: #94a3b8;

            text-decoration: none;
        }

        .back-home:hover {
            color: white;
        }

    </style>

<script src="../js/company-config.js"></script>
    <script src="../js/api.js"></script>
</head>

<body>

<div class="login-wrapper">

    <div class="login-card">

        <div class="icon-box">

            <i class="bi bi-building-fill"></i>

        </div>

        <div class="logo">

            Smart<span>Placement</span>

        </div>

        <p class="subtitle">

            Placement Cell Portal

        </p>


        <div class="error" id="error">

            Invalid email or password.

        </div>


        <form onsubmit="login(event)">

            <div class="mb-3">

                <label>
                    Official Email
                </label>

                <input
                    type="email"
                    id="email"
                    class="form-control"
                    placeholder="placement@college.edu"
                    required>

            </div>


            <div class="mb-4">

                <label>
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    class="form-control"
                    placeholder="Enter password"
                    required>

            </div>


            <button
                type="submit"
                class="login-btn">

                <i class="bi bi-box-arrow-in-right me-2"></i>

                Login to Placement Cell

            </button>

        </form>


        <div class="demo-box">

            <strong>Demo Placement Cell Account</strong>

            <br><br>

            Email:
            <strong>placement@gmail.com</strong>

            <br>

            Password:
            <strong>placement123</strong>

        </div>


        <a
            href="../index.html"
            class="back-home">

            <i class="bi bi-arrow-left me-1"></i>

            Back to Home

        </a>

    </div>

</div>


<script>
async function login(event) {
    event.preventDefault();
    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value;
    const error = document.getElementById("error");
    error.style.display = "none";
    try {
        const user = await apiRequest("/auth/placement/login", {method:"POST", body:JSON.stringify({email,password})});
        saveSession(user);
        window.location.href = "dashboard.html";
    } catch (err) { error.textContent = err.message; error.style.display = "block"; }
}
</script>

</body>
</html>
