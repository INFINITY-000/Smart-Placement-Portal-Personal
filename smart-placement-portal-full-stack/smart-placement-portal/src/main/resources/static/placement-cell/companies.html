<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Companies | Smart Placement Portal</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
        rel="stylesheet">

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: "Segoe UI", sans-serif;
            background: #080b16;
            color: #f1f5f9;
        }

        /* SIDEBAR */

        .sidebar {
            position: fixed;
            left: 0;
            top: 0;

            width: 250px;
            height: 100vh;

            padding: 25px 15px;

            background: rgba(13,18,35,0.96);

            border-right:
                1px solid rgba(255,255,255,0.08);

            z-index: 1000;
        }

        .logo {
            font-size: 22px;
            font-weight: 700;
            padding: 0 12px 20px;
        }

        .logo span {
            color: #7c3aed;
        }

        .portal-label {
            padding: 0 12px 15px;

            color: #64748b;

            font-size: 11px;

            text-transform: uppercase;

            letter-spacing: 1px;
        }

        .nav-link {
            color: #94a3b8;

            padding: 13px 15px;

            margin: 5px 0;

            border-radius: 10px;

            display: flex;

            align-items: center;

            gap: 12px;

            text-decoration: none;

            transition: 0.3s;
        }

        .nav-link:hover,
        .nav-link.active {
            background:
                linear-gradient(
                    90deg,
                    #6d28d9,
                    #4f46e5
                );

            color: white;
        }

        .logout {
            position: absolute;

            bottom: 25px;

            left: 15px;
            right: 15px;

            color: #f87171;
        }

        /* MAIN */

        .main {
            margin-left: 250px;
            padding: 35px;
        }

        .top-header {

            display: flex;

            justify-content: space-between;

            align-items: center;

            margin-bottom: 30px;
        }

        .page-title {

            font-size: 30px;

            font-weight: 700;

            margin: 0;
        }

        .subtitle {

            color: #94a3b8;

            margin-top: 6px;
        }

        .add-btn {

            border: none;

            padding: 11px 18px;

            border-radius: 10px;

            color: white;

            background:
                linear-gradient(
                    135deg,
                    #7c3aed,
                    #4f46e5
                );

            font-weight: 600;

            transition: 0.3s;
        }

        .add-btn:hover {

            transform: translateY(-2px);

            box-shadow:
                0 8px 25px
                rgba(124,58,237,0.3);
        }

        /* SEARCH */

        .search-card {

            padding: 20px;

            margin-bottom: 25px;

            background:
                rgba(20,27,49,0.75);

            border:
                1px solid rgba(255,255,255,0.08);

            border-radius: 16px;
        }

        .search-box {

            position: relative;
        }

        .search-box i {

            position: absolute;

            left: 15px;

            top: 50%;

            transform: translateY(-50%);

            color: #64748b;
        }

        .search-box input {

            padding-left: 43px;
        }

        .form-control {

            background: #0f172a;

            border:
                1px solid rgba(255,255,255,0.1);

            color: white;

            padding: 11px 13px;

            border-radius: 10px;
        }

        .form-control:focus {

            background: #0f172a;

            color: white;

            border-color: #7c3aed;

            box-shadow:
                0 0 0 3px
                rgba(124,58,237,0.15);
        }

        .form-control::placeholder {
            color: #64748b;
        }

        /* COMPANY CARD */

        .company-card {

            background:
                rgba(20,27,49,0.75);

            border:
                1px solid rgba(255,255,255,0.08);

            border-radius: 18px;

            padding: 23px;

            height: 100%;

            transition: 0.3s;
        }

        .company-card:hover {

            transform: translateY(-5px);

            border-color:
                rgba(124,58,237,0.45);

            box-shadow:
                0 15px 40px
                rgba(0,0,0,0.25);
        }

        .company-top {

            display: flex;

            justify-content: space-between;

            align-items: flex-start;

            margin-bottom: 18px;
        }

        .company-icon {

            width: 52px;
            height: 52px;

            border-radius: 14px;

            background:
                linear-gradient(
                    135deg,
                    #7c3aed,
                    #4f46e5
                );

            display: flex;

            align-items: center;

            justify-content: center;

            font-size: 22px;
        }

        .active-badge {

            padding: 5px 10px;

            border-radius: 20px;

            background:
                rgba(34,197,94,0.12);

            color: #4ade80;

            font-size: 11px;

            font-weight: 600;
        }

        .company-card h5 {

            margin-bottom: 5px;

            font-size: 19px;
        }

        .industry {

            color: #94a3b8;

            font-size: 13px;

            margin-bottom: 18px;
        }

        .company-info {

            display: flex;

            align-items: center;

            gap: 8px;

            color: #cbd5e1;

            font-size: 13px;

            margin-bottom: 9px;
        }

        .company-info i {

            color: #a78bfa;

        }

        .company-footer {

            display: flex;

            justify-content: space-between;

            align-items: center;

            margin-top: 20px;

            padding-top: 15px;

            border-top:
                1px solid
                rgba(255,255,255,0.07);
        }

        .drive-count {

            color: #94a3b8;

            font-size: 12px;
        }

        .delete-btn {

            border: none;

            background:
                rgba(239,68,68,0.1);

            color: #f87171;

            width: 34px;
            height: 34px;

            border-radius: 8px;

            transition: 0.3s;
        }

        .delete-btn:hover {

            background:
                rgba(239,68,68,0.2);
        }

        /* MODAL */

        .modal-content {

            background: #111827;

            color: white;

            border:
                1px solid
                rgba(255,255,255,0.1);

            border-radius: 18px;
        }

        .modal-header {

            border-bottom:
                1px solid
                rgba(255,255,255,0.08);
        }

        .modal-footer {

            border-top:
                1px solid
                rgba(255,255,255,0.08);
        }

        .btn-close {

            filter: invert(1);
        }

        .save-btn {

            border: none;

            padding: 10px 20px;

            border-radius: 9px;

            color: white;

            background:
                linear-gradient(
                    135deg,
                    #7c3aed,
                    #4f46e5
                );
        }

        /* EMPTY */

        .empty {

            text-align: center;

            padding: 70px 20px;

            color: #94a3b8;
        }

        .empty i {

            display: block;

            font-size: 55px;

            color: #475569;

            margin-bottom: 15px;
        }

        .empty h4 {

            color: #e2e8f0;
        }

        /* MOBILE */

        @media(max-width:700px) {

            .sidebar {

                position: relative;

                width: 100%;

                height: auto;
            }

            .logout {

                position: static;

                margin-top: 10px;
            }

            .main {

                margin-left: 0;

                padding: 20px;
            }

            .top-header {

                display: block;
            }

            .add-btn {

                margin-top: 15px;
            }

        }

    </style>

<script src="../js/company-config.js"></script>
    <script src="../js/api.js"></script>
</head>


<body>


<!-- SIDEBAR -->

<div class="sidebar">

    <div class="logo">
        Smart<span>Placement</span>
    </div>

    <div class="portal-label">
        Placement Cell
    </div>


    <a
        href="dashboard.html"
        class="nav-link">

        <i class="bi bi-grid-1x2-fill"></i>

        Dashboard

    </a>


    <a
        href="companies.html"
        class="nav-link active">

        <i class="bi bi-buildings-fill"></i>

        Companies

    </a>


    <a
        href="drives.html"
        class="nav-link">

        <i class="bi bi-briefcase-fill"></i>

        Placement Drives

    </a>


    <a
        href="students.html"
        class="nav-link">

        <i class="bi bi-people-fill"></i>

        Students

    </a>


    <a
        href="applications.html"
        class="nav-link">

        <i class="bi bi-file-earmark-text-fill"></i>

        Applications

    </a>


    <a
        href="../index.html"
        class="nav-link">

        <i class="bi bi-house-fill"></i>

        Home

    </a>


    <a
        href="#"
        class="nav-link logout"
        onclick="logout()">

        <i class="bi bi-box-arrow-left"></i>

        Logout

    </a>

</div>


<!-- MAIN -->

<div class="main">


    <div class="top-header">

        <div>

            <h1 class="page-title">
                Companies
            </h1>

            <p class="subtitle">
                Manage companies participating in campus placements.
            </p>

        </div>


        <button
            class="add-btn"
            data-bs-toggle="modal"
            data-bs-target="#companyModal">

            <i class="bi bi-plus-lg me-2"></i>

            Add Company

        </button>

    </div>


    <!-- SEARCH -->

    <div class="search-card">

        <div class="search-box">

            <i class="bi bi-search"></i>

            <input
                type="text"
                id="searchInput"
                class="form-control"
                placeholder="Search company, industry or location..."
                oninput="searchCompanies()">

        </div>

    </div>


    <!-- COMPANIES -->

    <div class="row g-4" id="companyContainer"></div>


</div>


<!-- ADD COMPANY MODAL -->

<div
    class="modal fade"
    id="companyModal"
    tabindex="-1">

    <div class="modal-dialog modal-dialog-centered">

        <div class="modal-content">


            <div class="modal-header">

                <h5 class="modal-title">

                    <i class="bi bi-building-add me-2"></i>

                    Add New Company

                </h5>

                <button
                    type="button"
                    class="btn-close"
                    data-bs-dismiss="modal">
                </button>

            </div>


            <div class="modal-body">

                <div class="mb-3">

                    <label class="form-label">
                        Company Name
                    </label>

                    <input
                        type="text"
                        id="companyName"
                        class="form-control"
                        placeholder="Example: Infosys">

                </div>


                <div class="mb-3">

                    <label class="form-label">
                        Industry
                    </label>

                    <input
                        type="text"
                        id="industry"
                        class="form-control"
                        placeholder="Example: Information Technology">

                </div>


                <div class="mb-3">

                    <label class="form-label">
                        Location
                    </label>

                    <input
                        type="text"
                        id="location"
                        class="form-control"
                        placeholder="Example: Mumbai">

                </div>


                <div class="mb-3">

                    <label class="form-label">
                        HR Email
                    </label>

                    <input
                        type="email"
                        id="hrEmail"
                        class="form-control"
                        placeholder="hr@company.com">

                </div>

            </div>


            <div class="modal-footer">

                <button
                    type="button"
                    class="btn btn-secondary"
                    data-bs-dismiss="modal">

                    Cancel

                </button>


                <button
                    type="button"
                    class="save-btn"
                    onclick="addCompany()">

                    <i class="bi bi-check-lg me-1"></i>

                    Add Company

                </button>

            </div>

        </div>

    </div>

</div>


<script
src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
</script>


<script>
let companies = [];
let drives = [];
async function loadCompanies() { companies = await apiRequest('/companies'); drives = await apiRequest('/drives'); displayCompanies(); }
function displayCompanies(list = companies) {
    const container=document.getElementById('companyContainer');
    if(!list.length){container.innerHTML='<div class="col-12"><div class="empty"><i class="bi bi-building-x"></i><h4>No Companies Found</h4><p>Add a company or change your search.</p></div></div>';return;}
    container.innerHTML=list.map(c=>{const count=drives.filter(d=>d.companyId===c.id).length;return `<div class="col-lg-4 col-md-6"><div class="company-card"><div class="company-top"><div class="company-icon"><i class="bi bi-building"></i></div><span class="active-badge"><i class="bi bi-check-circle-fill me-1"></i>Active</span></div><h5>${c.name}</h5><div class="industry">${c.industry||''}</div><div class="company-info"><i class="bi bi-geo-alt-fill"></i>${c.location||''}</div><div class="company-info"><i class="bi bi-envelope-fill"></i>${c.hrEmail||'—'}</div><div class="company-footer"><span class="drive-count"><i class="bi bi-briefcase me-1"></i>${count} Placement Drive(s)</span><button class="delete-btn" onclick="deleteCompany(${c.id})" title="Delete Company"><i class="bi bi-trash3"></i></button></div></div></div>`;}).join('');
}
async function addCompany(){
    const payload={name:document.getElementById('companyName').value.trim(),industry:document.getElementById('industry').value.trim(),location:document.getElementById('location').value.trim(),hrEmail:document.getElementById('hrEmail').value.trim()};
    if(Object.values(payload).some(v=>!v)){alert('Please fill all company details.');return;}
    try{await apiRequest('/companies',{method:'POST',body:JSON.stringify(payload)});['companyName','industry','location','hrEmail'].forEach(id=>document.getElementById(id).value='');bootstrap.Modal.getInstance(document.getElementById('companyModal')).hide();await loadCompanies();alert('Company added to MySQL successfully!');}catch(e){alert(e.message);}
}
async function deleteCompany(id){if(!confirm('Are you sure you want to delete this company?'))return;try{await apiRequest('/companies/'+id,{method:'DELETE'});await loadCompanies();}catch(e){alert('Delete failed. A company with active drives may need its drives removed first.');}}
function searchCompanies(){const q=document.getElementById('searchInput').value.toLowerCase().trim();displayCompanies(companies.filter(c=>(c.name||'').toLowerCase().includes(q)||(c.industry||'').toLowerCase().includes(q)||(c.location||'').toLowerCase().includes(q)));}
function logout(){clearSession();window.location.href='login.html';}
loadCompanies().catch(e=>alert('Could not load companies. Start the Spring Boot server first.\n\n'+e.message));
</script>


</body>
</html>
