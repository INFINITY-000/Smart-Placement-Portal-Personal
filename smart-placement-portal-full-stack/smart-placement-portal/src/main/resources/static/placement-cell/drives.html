<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Placement Drives | Smart Placement Portal</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
        rel="stylesheet">

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: "Segoe UI", sans-serif;
            background: #080b16;
            color: #f1f5f9;
        }

        /* SIDEBAR */

        .sidebar {
            position: fixed;
            left: 0;
            top: 0;

            width: 250px;
            height: 100vh;

            padding: 25px 15px;

            background: rgba(13,18,35,0.96);

            border-right:
                1px solid rgba(255,255,255,0.08);

            z-index: 1000;
        }

        .logo {
            font-size: 22px;
            font-weight: 700;
            padding: 0 12px 20px;
        }

        .logo span {
            color: #7c3aed;
        }

        .portal-label {
            padding: 0 12px 15px;

            color: #64748b;

            font-size: 11px;

            text-transform: uppercase;

            letter-spacing: 1px;
        }

        .nav-link {
            color: #94a3b8;

            padding: 13px 15px;

            margin: 5px 0;

            border-radius: 10px;

            display: flex;

            align-items: center;

            gap: 12px;

            text-decoration: none;

            transition: 0.3s;
        }

        .nav-link:hover,
        .nav-link.active {
            background:
                linear-gradient(
                    90deg,
                    #6d28d9,
                    #4f46e5
                );

            color: white;
        }

        .logout {
            position: absolute;

            bottom: 25px;

            left: 15px;
            right: 15px;

            color: #f87171;
        }

        /* MAIN */

        .main {
            margin-left: 250px;
            padding: 35px;
        }

        .top-header {

            display: flex;

            justify-content: space-between;

            align-items: center;

            margin-bottom: 30px;
        }

        .page-title {

            font-size: 30px;

            font-weight: 700;

            margin: 0;
        }

        .subtitle {

            color: #94a3b8;

            margin-top: 6px;
        }

        .add-btn {

            border: none;

            padding: 11px 18px;

            border-radius: 10px;

            color: white;

            background:
                linear-gradient(
                    135deg,
                    #7c3aed,
                    #4f46e5
                );

            font-weight: 600;

            transition: 0.3s;
        }

        .add-btn:hover {

            transform: translateY(-2px);

            box-shadow:
                0 8px 25px
                rgba(124,58,237,0.3);
        }

        /* SEARCH */

        .search-card {

            padding: 20px;

            margin-bottom: 25px;

            background:
                rgba(20,27,49,0.75);

            border:
                1px solid rgba(255,255,255,0.08);

            border-radius: 16px;
        }

        .search-box {
            position: relative;
        }

        .search-box i {

            position: absolute;

            left: 15px;

            top: 50%;

            transform: translateY(-50%);

            color: #64748b;
        }

        .search-box input {
            padding-left: 43px;
        }

        .form-control,
        .form-select {

            background: #0f172a;

            border:
                1px solid rgba(255,255,255,0.1);

            color: white;

            padding: 11px 13px;

            border-radius: 10px;
        }

        .form-control:focus,
        .form-select:focus {

            background: #0f172a;

            color: white;

            border-color: #7c3aed;

            box-shadow:
                0 0 0 3px
                rgba(124,58,237,0.15);
        }

        .form-control::placeholder {
            color: #64748b;
        }

        .form-select option {
            background: #0f172a;
            color: white;
        }

        /* DRIVE CARD */

        .drive-card {

            background:
                rgba(20,27,49,0.75);

            border:
                1px solid rgba(255,255,255,0.08);

            border-radius: 18px;

            padding: 23px;

            height: 100%;

            transition: 0.3s;

            position: relative;
        }

        .drive-card:hover {

            transform: translateY(-5px);

            border-color:
                rgba(124,58,237,0.45);

            box-shadow:
                0 15px 40px
                rgba(0,0,0,0.25);
        }

        .drive-top {

            display: flex;

            justify-content: space-between;

            align-items: flex-start;

            margin-bottom: 18px;
        }

        .company-icon {

            width: 52px;
            height: 52px;

            border-radius: 14px;

            background:
                linear-gradient(
                    135deg,
                    #7c3aed,
                    #4f46e5
                );

            display: flex;

            align-items: center;

            justify-content: center;

            font-size: 22px;
        }

        .active-badge {

            padding: 5px 10px;

            border-radius: 20px;

            background:
                rgba(34,197,94,0.12);

            color: #4ade80;

            font-size: 11px;

            font-weight: 600;
        }

        .drive-card h5 {

            margin-bottom: 5px;

            font-size: 19px;
        }

        .company-name {

            color: #a78bfa;

            font-size: 13px;

            margin-bottom: 18px;
        }

        .drive-info {

            display: flex;

            align-items: center;

            gap: 9px;

            color: #cbd5e1;

            font-size: 13px;

            margin-bottom: 10px;
        }

        .drive-info i {
            color: #a78bfa;
        }

        .package {

            color: #4ade80;

            font-weight: 700;

            font-size: 18px;

            margin-top: 15px;
        }

        .deadline {

            color: #facc15;

            font-size: 12px;

            margin-top: 5px;
        }

        .drive-footer {

            display: flex;

            justify-content: space-between;

            align-items: center;

            margin-top: 20px;

            padding-top: 15px;

            border-top:
                1px solid
                rgba(255,255,255,0.07);
        }

        .delete-btn {

            border: none;

            background:
                rgba(239,68,68,0.1);

            color: #f87171;

            width: 35px;
            height: 35px;

            border-radius: 8px;

            transition: 0.3s;
        }

        .delete-btn:hover {
            background:
                rgba(239,68,68,0.2);
        }

        /* MODAL */

        .modal-content {

            background: #111827;

            color: white;

            border:
                1px solid
                rgba(255,255,255,0.1);

            border-radius: 18px;
        }

        .modal-header {

            border-bottom:
                1px solid
                rgba(255,255,255,0.08);
        }

        .modal-footer {

            border-top:
                1px solid
                rgba(255,255,255,0.08);
        }

        .btn-close {
            filter: invert(1);
        }

        .save-btn {

            border: none;

            padding: 10px 20px;

            border-radius: 9px;

            color: white;

            background:
                linear-gradient(
                    135deg,
                    #7c3aed,
                    #4f46e5
                );
        }

        /* EMPTY */

        .empty {

            text-align: center;

            padding: 70px 20px;

            color: #94a3b8;
        }

        .empty i {

            display: block;

            font-size: 55px;

            color: #475569;

            margin-bottom: 15px;
        }

        .empty h4 {
            color: #e2e8f0;
        }

        /* MOBILE */

        @media(max-width:700px) {

            .sidebar {

                position: relative;

                width: 100%;

                height: auto;
            }

            .logout {

                position: static;

                margin-top: 10px;
            }

            .main {

                margin-left: 0;

                padding: 20px;
            }

            .top-header {

                display: block;
            }

            .add-btn {

                margin-top: 15px;
            }

        }

    </style>

<script src="../js/company-config.js"></script>
    <script src="../js/api.js"></script>
</head>


<body>


<!-- SIDEBAR -->

<div class="sidebar">

    <div class="logo">
        Smart<span>Placement</span>
    </div>

    <div class="portal-label">
        Placement Cell
    </div>


    <a href="dashboard.html" class="nav-link">

        <i class="bi bi-grid-1x2-fill"></i>

        Dashboard

    </a>


    <a href="companies.html" class="nav-link">

        <i class="bi bi-buildings-fill"></i>

        Companies

    </a>


    <a href="drives.html" class="nav-link active">

        <i class="bi bi-briefcase-fill"></i>

        Placement Drives

    </a>


    <a href="students.html" class="nav-link">

        <i class="bi bi-people-fill"></i>

        Students

    </a>


    <a href="applications.html" class="nav-link">

        <i class="bi bi-file-earmark-text-fill"></i>

        Applications

    </a>


    <a href="../index.html" class="nav-link">

        <i class="bi bi-house-fill"></i>

        Home

    </a>


    <a
        href="#"
        class="nav-link logout"
        onclick="logout()">

        <i class="bi bi-box-arrow-left"></i>

        Logout

    </a>

</div>


<!-- MAIN -->

<div class="main">


    <div class="top-header">

        <div>

            <h1 class="page-title">
                Placement Drives
            </h1>

            <p class="subtitle">
                Create and manage campus recruitment drives.
            </p>

        </div>


        <button
            class="add-btn"
            data-bs-toggle="modal"
            data-bs-target="#driveModal">

            <i class="bi bi-plus-lg me-2"></i>

            Create Drive

        </button>

    </div>


    <!-- SEARCH -->

    <div class="search-card">

        <div class="search-box">

            <i class="bi bi-search"></i>

            <input
                type="text"
                id="searchInput"
                class="form-control"
                placeholder="Search company, role or location..."
                oninput="searchDrives()">

        </div>

    </div>


    <!-- DRIVES -->

    <div class="row g-4" id="driveContainer"></div>


</div>


<!-- CREATE DRIVE MODAL -->

<div
    class="modal fade"
    id="driveModal"
    tabindex="-1">

    <div class="modal-dialog modal-dialog-centered modal-lg">

        <div class="modal-content">


            <div class="modal-header">

                <h5 class="modal-title">

                    <i class="bi bi-briefcase-fill me-2"></i>

                    Create Placement Drive

                </h5>

                <button
                    type="button"
                    class="btn-close"
                    data-bs-dismiss="modal">
                </button>

            </div>


            <div class="modal-body">

                <div class="row g-3">


                    <!-- COMPANY -->

                    <div class="col-md-6">

                        <label class="form-label">
                            Company
                        </label>

                        <select
                            id="company"
                            class="form-select">

                        </select>

                    </div>


                    <!-- ROLE -->

                    <div class="col-md-6">

                        <label class="form-label">
                            Job Role
                        </label>

                        <input
                            type="text"
                            id="role"
                            class="form-control"
                            placeholder="Example: Java Developer">

                    </div>


                    <!-- PACKAGE -->

                    <div class="col-md-6">

                        <label class="form-label">
                            Package
                        </label>

                        <input
                            type="text"
                            id="package"
                            class="form-control"
                            placeholder="Example: ₹8 LPA">

                    </div>


                    <!-- LOCATION -->

                    <div class="col-md-6">

                        <label class="form-label">
                            Job Location
                        </label>

                        <input
                            type="text"
                            id="location"
                            class="form-control"
                            placeholder="Example: Mumbai">

                    </div>


                    <!-- CGPA -->

                    <div class="col-md-6">

                        <label class="form-label">
                            Minimum CGPA
                        </label>

                        <input
                            type="number"
                            id="cgpa"
                            class="form-control"
                            step="0.1"
                            min="0"
                            max="10"
                            placeholder="Example: 7.0">

                    </div>


                    <!-- DEADLINE -->

                    <div class="col-md-6">

                        <label class="form-label">
                            Application Deadline
                        </label>

                        <input
                            type="date"
                            id="deadline"
                            class="form-control">

                    </div>


                    <!-- DESCRIPTION -->

                    <div class="col-12">

                        <label class="form-label">
                            Drive Description
                        </label>

                        <textarea
                            id="description"
                            class="form-control"
                            rows="3"
                            placeholder="Enter job description and requirements...">
                        </textarea>

                    </div>

                </div>

            </div>


            <div class="modal-footer">

                <button
                    type="button"
                    class="btn btn-secondary"
                    data-bs-dismiss="modal">

                    Cancel

                </button>


                <button
                    type="button"
                    class="save-btn"
                    onclick="addDrive()">

                    <i class="bi bi-check-lg me-1"></i>

                    Create Drive

                </button>

            </div>

        </div>

    </div>

</div>


<script
src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
</script>


<script>
let drives=[];let companies=[];
async function loadCompanies(){companies=await apiRequest('/companies');const select=document.getElementById('company');select.innerHTML=companies.map(c=>`<option value="${c.id}">${c.name}</option>`).join('');}
async function loadDrives(){drives=await apiRequest('/drives');displayDrives();}
function displayDrives(list=drives){const container=document.getElementById('driveContainer');if(!list.length){container.innerHTML='<div class="col-12"><div class="empty"><i class="bi bi-briefcase"></i><h4>No Placement Drives</h4><p>Create a new placement drive to get started.</p></div></div>';return;}container.innerHTML=list.map(d=>`<div class="col-lg-4 col-md-6"><div class="drive-card"><div class="drive-top"><div class="company-icon"><i class="bi bi-building"></i></div><span class="active-badge"><i class="bi bi-circle-fill me-1"></i>${d.status||'Active'}</span></div><h5>${d.role}</h5><div class="company-name">${d.company}</div><div class="drive-info"><i class="bi bi-cash-stack"></i>${d.package}</div><div class="drive-info"><i class="bi bi-geo-alt"></i>${d.location}</div><div class="drive-info"><i class="bi bi-mortarboard"></i>Minimum ${d.cgpa} CGPA</div><div class="drive-info"><i class="bi bi-calendar-event"></i>Deadline ${d.deadline||'—'}</div><p class="mt-3" style="color:#8994b0">${d.description||''}</p><button class="delete-btn" onclick="deleteDrive(${d.id})"><i class="bi bi-trash3"></i> Delete</button></div></div>`).join('');}
async function addDrive(){const payload={companyId:document.getElementById('company').value,jobRole:document.getElementById('role').value.trim(),packageAmount:document.getElementById('package').value.trim(),location:document.getElementById('location').value.trim(),minCgpa:document.getElementById('cgpa').value,deadline:document.getElementById('deadline').value,description:document.getElementById('description').value.trim()};if(!payload.companyId||!payload.jobRole||!payload.packageAmount||!payload.location||!payload.minCgpa||!payload.deadline||!payload.description){alert('Please fill all drive details.');return;}try{await apiRequest('/drives',{method:'POST',body:JSON.stringify(payload)});bootstrap.Modal.getInstance(document.getElementById('driveModal')).hide();await loadDrives();alert('Placement drive saved to MySQL successfully!');}catch(e){alert(e.message);}}
async function deleteDrive(id){if(!confirm('Delete this placement drive?'))return;try{await apiRequest('/drives/'+id,{method:'DELETE'});await loadDrives();}catch(e){alert('Delete failed: '+e.message);}}
function searchDrives(){const q=document.getElementById('searchInput').value.toLowerCase().trim();displayDrives(drives.filter(d=>(d.company||'').toLowerCase().includes(q)||(d.role||'').toLowerCase().includes(q)||(d.location||'').toLowerCase().includes(q)));}
function logout(){clearSession();window.location.href='login.html';}
Promise.all([loadCompanies(),loadDrives()]).catch(e=>alert('Could not load placement drives. Start the Spring Boot server first.\n\n'+e.message));
</script>


</body>
</html>
