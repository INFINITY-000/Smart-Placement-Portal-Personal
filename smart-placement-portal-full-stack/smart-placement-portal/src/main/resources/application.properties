# =====================================================================
# application.properties — Spring Boot Configuration File
# This file configures how Spring Boot connects to MySQL,
# how JPA behaves, and other server settings.
# =====================================================================

# ----- Server Settings -----
# The port on which the Spring Boot app will run.
# Visit http://localhost:8080 in your browser to access the app.
server.port=8080

# ----- MySQL Database Connection -----
# IMPORTANT: Change 'root' and 'yourpassword' to your actual MySQL credentials.
# 'smart_placement_db' is the name of the database we will create in MySQL.
spring.datasource.url=jdbc:mysql://localhost:3306/smart_placement_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=${MYSQL_PASSWORD:yourpassword}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ----- JPA / Hibernate Settings -----
# hibernate.ddl-auto tells Spring Boot what to do with the database schema:
#   'create-drop' = creates tables on startup, drops on shutdown (for testing)
#   'update'      = updates existing tables without deleting data
#   'validate'    = only checks if tables match entities, no changes
# We use 'update' so our tables persist between restarts.
spring.jpa.hibernate.ddl-auto=update

# Show the actual SQL queries in the console (useful for learning & debugging)
spring.jpa.show-sql=true

# Format the SQL output so it's readable
spring.jpa.properties.hibernate.format_sql=true

# Tell Hibernate we are using MySQL 8 dialect
# Dialect = the specific SQL "flavour" for our database
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect

# ----- Jackson (JSON) Settings -----
# Don't include null fields in JSON responses (keeps responses clean)
spring.jackson.default-property-inclusion=non_null

# Format dates as ISO strings instead of timestamps
spring.jackson.serialization.write-dates-as-timestamps=false

# ----- Logging -----
logging.level.com.smartplacement=DEBUG
logging.level.org.hibernate.SQL=DEBUG
